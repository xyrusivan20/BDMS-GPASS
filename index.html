<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gate Pass System</title>

    <!-- =================================================================== -->
    <!--  I-EDIT LANG ANG 2 LINYA SA IBABA — ilagay ang galing sa Supabase mo  -->
    <!-- =================================================================== -->
    <script>
      window.__SUPABASE_URL__      = "PALITAN-NG-PROJECT-URL";   // hal. https://abcd1234.supabase.co
      window.__SUPABASE_ANON_KEY__ = "PALITAN-NG-ANON-KEY";       // ang mahabang "eyJ..." na anon public key
    </script>
    <!-- =================================================================== -->
    <!--  HANGGANG DITO LANG ANG IE-EDIT. Huwag galawin ang iba sa baba.       -->
    <!-- =================================================================== -->

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* Blank-page guard: kung may error o walang lumitaw, ipakita ito imbes na blangko. */
      (function () {
        function show(msg) {
          var r = document.getElementById("root"); if (!r) return;
          r.innerHTML =
            '<div style="font-family:system-ui,Segoe UI,Arial;max-width:640px;margin:40px auto;padding:16px 18px;border:1px solid #D8B0AA;background:#F9EDEB;border-radius:12px;color:#5a2a24">' +
            '<div style="font-weight:700;font-size:15px">May problema sa pag-load</div>' +
            '<div style="font-size:12.5px;margin-top:8px;white-space:pre-wrap;font-family:ui-monospace,monospace;background:#fff;border-radius:6px;padding:8px;max-height:180px;overflow:auto">' +
            String(msg).slice(0, 700) + '</div>' +
            '<div style="font-size:12px;margin-top:10px;color:#6b6350">I-screenshot ito. Karaniwang ayos: (1) siguraduhing na-edit ang 2 keys sa itaas ng file; (2) i-host sa Netlify (huwag i-double-click) at buksan ang link na iyon; (3) hard-refresh (Ctrl+Shift+R o Cmd+Shift+R).</div>' +
            '</div>';
        }
        window.addEventListener("error", function (e) { show((e && e.message) || "Script error"); }, true);
        window.addEventListener("unhandledrejection", function (e) { show("Promise error: " + ((e && e.reason && (e.reason.message || e.reason)) || "")); });
        setTimeout(function () {
          var r = document.getElementById("root");
          if (r && r.childNodes.length === 0) {
            show("Blank pagkatapos mag-load. Malamang: hindi na-edit ang 2 keys sa itaas, o na-double-click ang file (file://) imbes na naka-host. Subukan ang Netlify link at hard-refresh.");
          }
        }, 5000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
